name: Android Release APK and AAB

on:
  workflow_dispatch:

jobs:
  build-release-artifacts:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Validate web app
        run: npm run validate

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          fail_invalid_secret() {
            detail="$1"
            echo "::error title=Invalid Android release keystore secret::ANDROID_KEYSTORE_BASE64 is invalid."
            echo "::error::${detail}"
            echo "ANDROID_KEYSTORE_BASE64 is invalid."
            echo "Download temporary-android-release-keystore artifact and paste the FULL content of release-key.base64.txt into the GitHub secret."
            exit 1
          }

          use_existing_keystore_fallback() {
            if [ -s android/release-key.jks ]; then
              existing_size="$(wc -c < android/release-key.jks | tr -d ' ')"
              echo "Using existing android/release-key.jks fallback."
              echo "Existing keystore file size: ${existing_size} bytes"
              return 0
            fi

            if [ -s release-key.jks ]; then
              cp release-key.jks android/release-key.jks
              existing_size="$(wc -c < android/release-key.jks | tr -d ' ')"
              echo "Using existing release-key.jks fallback."
              echo "Existing keystore file size: ${existing_size} bytes"
              return 0
            fi

            return 1
          }

          trap 'rm -f keystore.base64 release-key.decoded' EXIT
          mkdir -p android

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error title=Missing Android release keystore secret::ANDROID_KEYSTORE_BASE64 secret is required."
            echo "ANDROID_KEYSTORE_BASE64 secret is required."
            echo "Download temporary-android-release-keystore artifact and paste the FULL content of release-key.base64.txt into the GitHub secret."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' > keystore.base64
          base64_length="$(wc -c < keystore.base64 | tr -d ' ')"
          echo "ANDROID_KEYSTORE_BASE64 normalized length: ${base64_length} characters"

          if [ "$base64_length" -eq 0 ]; then
            if use_existing_keystore_fallback; then
              exit 0
            fi
            fail_invalid_secret "The secret is empty after removing CRLF, tabs, and spaces."
          fi

          if ! grep -Eq '^[A-Za-z0-9+/]*={0,2}$' keystore.base64; then
            if use_existing_keystore_fallback; then
              exit 0
            fi
            fail_invalid_secret "The secret contains characters that are not valid base64 after removing CRLF, tabs, and spaces."
          fi

          if ! base64 --decode keystore.base64 > /dev/null; then
            if use_existing_keystore_fallback; then
              exit 0
            fi
            fail_invalid_secret "base64 validation failed after normalizing the secret."
          fi

          if ! base64 --decode keystore.base64 > release-key.decoded; then
            rm -f release-key.decoded
            if use_existing_keystore_fallback; then
              exit 0
            fi
            fail_invalid_secret "base64 --decode failed after normalizing the secret."
          fi

          if [ ! -s release-key.decoded ]; then
            rm -f release-key.decoded
            if use_existing_keystore_fallback; then
              exit 0
            fi
            fail_invalid_secret "Decoded keystore file is empty."
          fi

          mv release-key.decoded android/release-key.jks

          decoded_size="$(wc -c < android/release-key.jks | tr -d ' ')"
          echo "Decoded keystore file size: ${decoded_size} bytes"

      - name: Create signing properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"
          {
            printf 'storeFile=%s\n' 'release-key.jks'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/release-key.jks android/key.properties

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK and AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify release APK AdMob production config
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          config="$(unzip -p "$apk" assets/public/assets/config/admob.config.json)"
          printf '%s\n' "$config"
          printf '%s' "$config" | grep -F '"testMode": false'
          ! printf '%s' "$config" | grep -F '"testMode": true'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825~6983634337'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825/8264926419'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825/5478980972'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.tayibat.life' versionCode='6' versionName='1.0.6'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Verify release AAB AdMob production config
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          config="$(unzip -p "$aab" base/assets/public/assets/config/admob.config.json)"
          printf '%s\n' "$config"
          printf '%s' "$config" | grep -F '"testMode": false'
          ! printf '%s' "$config" | grep -F '"testMode": true'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825~6983634337'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825/8264926419'
          printf '%s' "$config" | grep -F 'ca-app-pub-4441958861355825/5478980972'

      - name: Rename release APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/tayibat-life-1.0.6-apkpure-release.apk

      - name: Rename release AAB
        run: |
          test -f android/app/build/outputs/bundle/release/app-release.aab
          mv android/app/build/outputs/bundle/release/app-release.aab android/app/build/outputs/bundle/release/tayibat-life-1.0.6-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tayibat-life-1.0.6-apkpure-release-apk
          path: android/app/build/outputs/apk/release/tayibat-life-1.0.6-apkpure-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: tayibat-life-1.0.6-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
