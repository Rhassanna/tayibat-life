name: TEMP Generate Android Release Keystore

# TEMPORARY WORKFLOW:
# Use this only to create the first release keystore when Java is not available locally.
# After downloading the artifact and saving the GitHub Secrets, delete this workflow.

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Replace placeholder with a strong keystore password. Do not reuse public examples."
        required: true
        default: "REPLACE_WITH_STRONG_KEYSTORE_PASSWORD"
      key_password:
        description: "Replace placeholder with a strong key password. Do not reuse public examples."
        required: true
        default: "REPLACE_WITH_STRONG_KEY_PASSWORD"

jobs:
  generate-keystore:
    name: Generate temporary release keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate release keystore and base64
        env:
          KEYSTORE_PASSWORD: ${{ inputs.store_password }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |
          set -euo pipefail

          if [ "$KEYSTORE_PASSWORD" = "REPLACE_WITH_STRONG_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Replace keystore password placeholder::Enter a real keystore password when running this temporary workflow."
            exit 1
          fi

          if [ "$KEY_PASSWORD" = "REPLACE_WITH_STRONG_KEY_PASSWORD" ]; then
            echo "::error title=Replace key password placeholder::Enter a real key password when running this temporary workflow."
            exit 1
          fi

          trap 'rm -f release-key.verify.jks' EXIT

          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -storetype JKS \
            -alias tayibat-life \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Tayibat Life, OU=Release, O=Tayibat Life, L=Casablanca, ST=Casablanca, C=MA" \
            -noprompt

          base64 -w 0 release-key.jks > release-key.base64.txt
          generated_keystore_size="$(wc -c < release-key.jks | tr -d ' ')"
          generated_base64_length="$(wc -c < release-key.base64.txt | tr -d ' ')"
          echo "Generated release-key.jks file size: ${generated_keystore_size} bytes"
          echo "Generated release-key.base64.txt length: ${generated_base64_length} characters"

          if ! base64 --decode release-key.base64.txt > release-key.verify.jks; then
            echo "::error title=Generated keystore base64 validation failed::release-key.base64.txt is not valid base64."
            exit 1
          fi

          if ! cmp -s release-key.jks release-key.verify.jks; then
            echo "::error title=Generated keystore base64 validation failed::Decoded release-key.base64.txt does not match release-key.jks."
            exit 1
          fi

          rm -f release-key.verify.jks

          {
            echo "ANDROID_KEY_ALIAS=tayibat-life"
            echo "ANDROID_KEYSTORE_BASE64=paste the FULL content of release-key.base64.txt"
            echo "ANDROID_KEYSTORE_PASSWORD=the password you entered"
            echo "ANDROID_KEY_PASSWORD=the password you entered"
          } > github-secret-values.txt

          echo "Generated release-key.jks, release-key.base64.txt, and github-secret-values.txt."
          echo "Save release-key.base64.txt as ANDROID_KEYSTORE_BASE64."
          echo "Save the passwords and alias tayibat-life as the Android signing secrets."
          echo "Delete this temporary workflow after the secrets are saved."

      - name: Upload temporary keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: temporary-android-release-keystore
          path: |
            release-key.jks
            release-key.base64.txt
            github-secret-values.txt
          if-no-files-found: error
          retention-days: 1
