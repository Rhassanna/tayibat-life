name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Validate web app
        run: npm run validate

      - name: Prepare Capacitor web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html app.js styles.css sw.js manifest.webmanifest privacy.html www/
          cp -R assets data www/

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../tmp
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee ../tmp/gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: tmp/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if APK build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Verify APK output
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayibat-life-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
